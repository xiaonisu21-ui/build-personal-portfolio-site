<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill 小红书轮播</title>
  <link rel="stylesheet" href="carousel.css" />
</head>
<body>
  <main id="slide" class="slide"></main>
  <script>
    const repo = "xiaonisu21-ui / build-personal-portfolio-site";
    const pages = [
      `
        <div class="topline"><span>OPEN-SOURCE CODEX SKILL</span><span>01 / 06</span></div>
        <div class="hero-copy">
          <p class="kicker">我把自己做个人网站的方法</p>
          <h1>封装成了<br><em>一个 Skill</em></h1>
          <p class="lead">简历 → 双语网站 → 隐私检查 → 可发布文件</p>
        </div>
        <div class="window window-home">
          <div class="window-bar"><i></i><i></i><i></i><span>portfolio.site</span></div>
          <div class="mini-site"><b>你好，我是<br><em>林知夏</em></b><div class="avatar"></div></div>
        </div>
        <p class="footnote">虚构演示人物与内容 · 开源项目</p>
      `,
      `
        <div class="topline"><span>WHY A SKILL?</span><span>02 / 06</span></div>
        <div class="hero-copy compact">
          <p class="kicker">它不只是再套一个网页模板</p>
          <h1>而是把建站方法<br>做成<em>可复用工作流</em></h1>
        </div>
        <div class="flow">
          <div><span>01</span><b>读材料</b><p>简历、案例、项目</p></div><i>→</i>
          <div><span>02</span><b>提炼定位</b><p>能力、证据、故事</p></div><i>→</i>
          <div><span>03</span><b>生成网站</b><p>双语、响应式</p></div>
        </div>
        <div class="quote">“先把你是谁、解决什么问题说清楚，再谈页面好不好看。”</div>
        <p class="repo">${repo}</p>
      `,
      `
        <div class="topline"><span>WHAT IT DOES</span><span>03 / 06</span></div>
        <div class="hero-copy compact"><p class="kicker">一套 Skill，覆盖四件事</p><h1>从内容到上线<br><em>都替你守住质量</em></h1></div>
        <div class="cap-grid">
          <article><span>01</span><b>能力提炼</b><p>把职责改写成问题、方法与结果</p></article>
          <article><span>02</span><b>中英双语</b><p>按专业语境改写，不做生硬直译</p></article>
          <article><span>03</span><b>隐私检查</b><p>扫描手机号、客户名、令牌与本地路径</p></article>
          <article><span>04</span><b>静态网站</b><p>无登录、手机适配，可部署到 GitHub Pages</p></article>
        </div>
        <p class="repo">MIT 开源 · ${repo}</p>
      `,
      `
        <div class="topline"><span>ONE PROMPT TO START</span><span>04 / 06</span></div>
        <div class="hero-copy compact"><p class="kicker">安装之后，可以直接这样说</p><h1>一句话开始<br><em>搭你的作品集</em></h1></div>
        <div class="prompt-box">
          <span>PROMPT</span>
          <p><b>$build-personal-portfolio-site</b><br>根据我的简历生成双语个人网站，隐藏手机号，案例脱敏，先预览不要发布。</p>
          <div class="cursor"></div>
        </div>
        <div class="safety-row"><span>✓ 不虚构成绩</span><span>✓ 不擅自发布</span><span>✓ 保留未要求修改的内容</span></div>
        <p class="repo">先预览，再确认，再公开</p>
      `,
      `
        <div class="topline"><span>FICTIONAL DEMO</span><span>05 / 06</span></div>
        <div class="hero-copy compact"><p class="kicker">公开教程也要保护隐私</p><h1>示例站用了<br><em>完整虚构身份</em></h1></div>
        <div class="demo-shot"><img src="../../../screenshots/demo-desktop.png" alt="虚构个人网站示例"></div>
        <div class="disclosure"><span></span><p><b>人物、经历、公司、指标、肖像</b><br>全部为虚构或 AI 生成内容，不对应真实个人。</p></div>
        <p class="repo">在线 Demo 无需登录即可查看</p>
      `,
      `
        <div class="topline"><span>NOW OPEN SOURCE</span><span>06 / 06</span></div>
        <div class="hero-copy final-copy"><p class="kicker">如果你也想认真做一次个人作品集</p><h1><em>开源了</em><br>欢迎拿去改</h1><p class="lead">Skill + 模板 + 隐私清单 + 在线 Demo + 小红书素材</p></div>
        <div class="link-card"><span>GITHUB</span><b>github.com/${repo.replace(" / ", "/")}</b></div>
        <div class="link-card light"><span>DEMO</span><b>xiaonisu21-ui.github.io/<br>build-personal-portfolio-site/</b></div>
        <div class="cta">收藏一下，之后做作品集时直接用 ↗</div>
        <p class="footnote">MIT License · Fictional demo · No login required</p>
      `
    ];
    const page = Math.min(6, Math.max(1, Number(new URLSearchParams(location.search).get("p")) || 1));
    document.body.dataset.page = page;
    document.querySelector("#slide").innerHTML = pages[page - 1];
  </script>
</body>
</html>
